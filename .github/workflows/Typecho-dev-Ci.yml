name: Typecho Dev Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  php:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none
    - name: Validate Composer
      run: composer validate --strict
    - name: Install Composer dependencies
      run: composer install --no-interaction --no-progress --prefer-dist
    - name: Syntax check
      run: |
        composer lint
    - name: Static analysis
      run: composer analyse
  assets:
    name: Node 24 Asset Build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: tools/package-lock.json
    - name: Install Node dependencies
      run: npm ci
      working-directory: tools
    - name: Build admin assets
      run: npm run build
      working-directory: tools
  build:
    name: Typecho Build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') && github.event_name != 'pull_request' }}
    needs:
        - php
        - assets
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build
      run: |
        mkdir build
        cp -r LICENSE.txt index.php install.php admin install usr var build/
        mkdir build/usr/uploads/
        chmod 755 build/usr/uploads/
        rm -rf build/admin/src
        rm -rf build/usr/themes/classic-22/static/scss
        cd build && zip -q -r typecho.zip * && mv typecho.zip ../ && cd -
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: typecho
        path: ./typecho.zip
